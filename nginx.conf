upstream drawo_backend {
    # Frontend compose is separate from backend compose. This points to the
    # backend exposed on the host, normally http://localhost:8080.
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React/Vite client-side routing. If a browser asks for /app later,
    # serve index.html and let React decide what page to show.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend REST API.
    location /api/ {
        proxy_pass http://drawo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend WebSocket endpoint.
    location /api/v1/ws {
        proxy_pass http://drawo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Local file storage URLs returned by the backend look like /uploads/...
    location /uploads/ {
        proxy_pass http://drawo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
