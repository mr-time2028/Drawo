# Production-like full stack.
#
# Option A architecture:
#   One Nginx container serves the built frontend and proxies /api and /api/v1/ws
#   to the Go backend. The host does not need Node/npm or Go installed.
#
# Run:
#   cp .env.example .env
#   docker compose up -d --build

services:
  app:
    container_name: drawo_app
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    environment:
      DRAWO_APP_NAME: ${DRAWO_APP_NAME:-Drawo}
      DRAWO_APP_DOMAIN: ${DRAWO_APP_DOMAIN:-http://localhost}
      DRAWO_APP_SECRET_KEY: ${DRAWO_APP_SECRET_KEY:-change-me-to-a-long-random-string-in-production}
      DRAWO_SERVER_HOST: 0.0.0.0
      DRAWO_SERVER_PORT: ${DRAWO_SERVER_PORT:-8080}
      DRAWO_DATABASE_DRIVER: ${DRAWO_DATABASE_DRIVER:-postgres}
      DRAWO_DATABASE_HOST: ${DRAWO_DATABASE_HOST:-postgres}
      DRAWO_DATABASE_PORT: ${DRAWO_DATABASE_PORT:-5432}
      DRAWO_DATABASE_NAME: ${DRAWO_DATABASE_NAME:-drawo}
      DRAWO_DATABASE_USER: ${DRAWO_DATABASE_USER:-postgres}
      DRAWO_DATABASE_PASSWORD: ${DRAWO_DATABASE_PASSWORD:-change-me-db-password}
      DRAWO_DATABASE_SSLMODE: ${DRAWO_DATABASE_SSLMODE:-disable}
      DRAWO_REDIS_HOST: ${DRAWO_REDIS_HOST:-redis}
      DRAWO_REDIS_PORT: ${DRAWO_REDIS_PORT:-6379}
      DRAWO_REDIS_PASSWORD: ${DRAWO_REDIS_PASSWORD:-}
      DRAWO_REDIS_DB: ${DRAWO_REDIS_DB:-0}
      DRAWO_CACHE_DRIVER: ${DRAWO_CACHE_DRIVER:-redis}
      DRAWO_CACHE_HOST: ${DRAWO_CACHE_HOST:-redis}
      DRAWO_CACHE_PORT: ${DRAWO_CACHE_PORT:-6379}
      DRAWO_CACHE_PASSWORD: ${DRAWO_CACHE_PASSWORD:-}
      DRAWO_CACHE_DB: ${DRAWO_CACHE_DB:-0}
      DRAWO_APP_STORAGE_DRIVER: ${DRAWO_APP_STORAGE_DRIVER:-local}
      DRAWO_APP_STORAGE_UPLOADDIR: ${DRAWO_APP_STORAGE_UPLOADDIR:-uploads}
      DRAWO_APP_STORAGE_BUCKETNAME: ${DRAWO_APP_STORAGE_BUCKETNAME:-drawo}
      DRAWO_APP_STORAGE_ENDPOINT: ${DRAWO_APP_STORAGE_ENDPOINT:-localhost:9000}
      DRAWO_APP_STORAGE_ACCESSKEY: ${DRAWO_APP_STORAGE_ACCESSKEY:-admin}
      DRAWO_APP_STORAGE_SECRETKEY: ${DRAWO_APP_STORAGE_SECRETKEY:-change-me-minio-password}
      DRAWO_APP_STORAGE_USESSL: ${DRAWO_APP_STORAGE_USESSL:-false}
      DRAWO_APP_STORAGE_REGION: ${DRAWO_APP_STORAGE_REGION:-us-east-1}
      DRAWO_AUTH_ISSUER: ${DRAWO_AUTH_ISSUER:-drawo}
      DRAWO_AUTH_AUDIENCE: ${DRAWO_AUTH_AUDIENCE:-drawo}
      DRAWO_AUTH_ACCESSTOKENEXPIRY: ${DRAWO_AUTH_ACCESSTOKENEXPIRY:-15m}
      DRAWO_AUTH_REFRESHTOKENEXPIRY: ${DRAWO_AUTH_REFRESHTOKENEXPIRY:-168h}
      DRAWO_AUTH_MAXLOGINATTEMPTS: ${DRAWO_AUTH_MAXLOGINATTEMPTS:-5}
      DRAWO_AUTH_LOGINLOCKOUTDURATION: ${DRAWO_AUTH_LOGINLOCKOUTDURATION:-1m}
      DRAWO_AUTH_REFRESHTOKENFAMILYSIZE: ${DRAWO_AUTH_REFRESHTOKENFAMILYSIZE:-10}
      DRAWO_LOG_LEVEL: ${DRAWO_LOG_LEVEL:-info}
      DRAWO_LOG_FORMAT: ${DRAWO_LOG_FORMAT:-json}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${DRAWO_SERVER_PORT}/health/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: drawo_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_DEFAULT_LANGUAGE: ${VITE_DEFAULT_LANGUAGE:-fa}
    ports:
      - "${DRAWO_NGINX_HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

  postgres:
    container_name: drawo_postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DRAWO_DATABASE_NAME:-drawo}
      POSTGRES_USER: ${DRAWO_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DRAWO_DATABASE_PASSWORD:-change-me-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: drawo_redis
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${DRAWO_REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --requirepass "$${REDIS_PASSWORD}";
      else
        redis-server;
      fi'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads:
