# Production Compose file.
#
# Responsibility:
#   - Run the full Drawo stack: nginx, Go app, PostgreSQL, Redis.
#   - MinIO is kept below as a commented optional service for future object storage use.
#   - Use multi-stage Docker builds and health checks.
#
# Usage:
#   make prod-up
#
# Docker Compose automatically reads the repository-root .env file for ${...}
# interpolation. The app container receives runtime configuration from the same
# .env through env_file, so production hostnames/endpoints should be set there.
# Infrastructure containers get only the official variables they require, mapped
# from the single DRAWO_* source of truth in .env.

services:
  app:
    container_name: drawo_app
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${DRAWO_SERVER_PORT}:${DRAWO_SERVER_PORT}"
    volumes:
      - assets:/app/assets
      - media:/app/media
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # MinIO is currently disabled because local storage is active.
      # Re-enable this block when DRAWO_APP_STORAGE_DRIVER=minio.
      # minio:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$DRAWO_SERVER_PORT/health/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    container_name: drawo_postgres
    image: postgres:17-alpine
    ports:
      - "${DRAWO_DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DRAWO_DATABASE_NAME}
      POSTGRES_USER: ${DRAWO_DATABASE_USER}
      POSTGRES_PASSWORD: ${DRAWO_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: drawo_redis
    image: redis:7-alpine
    ports:
      - "${DRAWO_REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${DRAWO_REDIS_PASSWORD}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Optional MinIO object storage service
  # ---------------------------------------------------------------------------
  # Local storage is currently enabled via:
  #   DRAWO_APP_STORAGE_DRIVER=local
  #
  # Keep this service commented while using local storage. To switch back to
  # MinIO later:
  #   1. Set DRAWO_APP_STORAGE_DRIVER=minio in .env
  #   2. Set DRAWO_APP_STORAGE_ENDPOINT=minio:9000 for full compose
  #   3. Uncomment this service
  #   4. Uncomment the app depends_on.minio block above
  #   5. Uncomment minio_data volume below
  #
  # minio:
  #   image: minio/minio
  #   container_name: drawo_storage
  #   ports:
  #     - "${DRAWO_MINIO_API_PORT}:9000"
  #     - "${DRAWO_MINIO_CONSOLE_PORT}:9001"
  #   environment:
  #     MINIO_ROOT_USER: ${DRAWO_APP_STORAGE_ACCESSKEY}
  #     MINIO_ROOT_PASSWORD: ${DRAWO_APP_STORAGE_SECRETKEY}
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: drawo_proxy
    ports:
      - "${DRAWO_NGINX_HTTP_PORT}:80"
      - "${DRAWO_NGINX_HTTPS_PORT}:443"
    depends_on:
      - app

volumes:
  postgres_data:
  # minio_data:
  assets:
  media:
  uploads:
